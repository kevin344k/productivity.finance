<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090a0e">
    <title>Sin conexión · MoneyPilot AI</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: radial-gradient(ellipse at 50% 0, #17243e, #090a0e 65%); color: #f4f5f7; font: 15px Arial, sans-serif; text-align: center; }
      main { max-width: 370px; }
      .mark { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 16px; background: linear-gradient(140deg, #74afff, #3372db); font-size: 26px; font-weight: 700; }
      h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -.7px; }
      p { margin: 0; color: #a1a1aa; font-size: 13px; line-height: 1.7; }
      a { display: inline-block; margin-top: 22px; padding: 11px 16px; border-radius: 8px; background: #3676d0; color: white; font-size: 12px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">M</div>
      <h1>Estás sin conexión</h1>
      <p>MoneyPilot guarda tus datos de forma segura en este dispositivo. Vuelve a conectarte para cargar tu panel financiero.</p>
      <a href="/">Intentar de nuevo</a>
    </main>
  </body>
</html>
